name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # See test job for context: paid package aliased to the trial package.
      - name: Use @bryntum/gantt-trial in CI
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@bryntum/gantt']")
          npm pkg set "dependencies.@bryntum/gantt=npm:@bryntum/gantt-trial@$VERSION"

      # package-lock.json is gitignored in this repo, so `npm ci` is unavailable.
      - run: npm install --no-audit --no-fund

      - run: npx --no-install eslint .

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The real @bryntum/gantt package is paid and not on the public registry.
      # Alias it to @bryntum/gantt-trial of the same version so every
      # `require('@bryntum/gantt/...')` resolves transparently in CI.
      - name: Use @bryntum/gantt-trial in CI
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@bryntum/gantt']")
          npm pkg set "dependencies.@bryntum/gantt=npm:@bryntum/gantt-trial@$VERSION"

      - run: npm install --no-audit --no-fund

      - run: npm test
