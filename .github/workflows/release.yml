name: Release

# Manually triggered from the GitHub UI (Actions → Release → Run workflow).
# Bumps the version in package.json, creates a tag, and publishes a GitHub
# Release whose body is auto-generated from merged PRs (see .github/release.yml).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'Dry run (no commit, tag or release will be created)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Guard against running on a non-default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Release must be run from the default branch (${{ github.event.repository.default_branch }}), got ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the default GITHUB_TOKEN for the push; protected-branch rules
          # may require a PAT or app token instead — adjust if so.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - run: npm install --no-audit --no-fund

      - run: npm test

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"

      - name: Commit, tag and push
        if: ${{ !inputs.dry-run }}
        run: |
          git add package.json
          git commit -m "chore(release): ${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.version }}" -m "${{ steps.bump.outputs.version }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.version }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          draft: false

      - name: Dry run summary
        if: ${{ inputs.dry-run }}
        run: |
          echo "## Dry run" >> "$GITHUB_STEP_SUMMARY"
          echo "Would have released **${{ steps.bump.outputs.version }}** (prerelease: ${{ inputs.prerelease }})." >> "$GITHUB_STEP_SUMMARY"
